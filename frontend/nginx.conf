server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # All client-side routes resolve to index.html so React Router (if added
    # later) works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → backend service ───────────────────────────────────────────
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # SSE-critical: disable nginx response buffering so events stream
        # immediately to the browser instead of being held until the buffer
        # fills.  The backend also sets X-Accel-Buffering: no, but this
        # config-level directive is the belt-and-suspenders guarantee.
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;   # keep SSE connections alive for up to 1 h
        chunked_transfer_encoding on;
    }
}
